<svg class="logo-svg" width="280" height="280" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
                <!-- 背景圆形 -->
                <circle cx="140" cy="140" r="130" fill="url(#gradient1)"/>
                
                <!-- 对话框主体 -->
                <path d="M100,90 C70,90 60,120 60,150 C60,180 70,210 100,210 L120,210 L130,230 L140,210 L180,210 C210,210 220,180 220,150 C220,120 210,90 180,90 L100,90 Z" fill="url(#gradient2)"/>
                
                <!-- 羽毛笔 -->
                <path d="M170,85 L165,120 C165,120 180,110 185,105 C190,100 195,95 195,95 C195,95 190,90 185,90 C180,90 170,85 170,85 Z" fill="#ffd700"/>
                <path d="M195,95 L200,100 L210,80 L195,80 L195,95 Z" fill="#ffaa00"/>
                
                <!-- 游戏元素 -->
                <circle cx="180" cy="150" r="25" fill="#6a11cb" opacity="0.8"/>
                <circle cx="180" cy="150" r="15" fill="#8a4fff"/>
                <circle cx="100" cy="130" r="10" fill="#2575fc"/>
                <circle cx="100" cy="170" r="10" fill="#2575fc"/>
                
                <!-- 文字 -->
                <text x="140" y="120" text-anchor="middle" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="white">呓界</text>
                <text x="140" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">DREAM WORLD</text>
                
                <!-- 装饰元素 -->
                <circle cx="80" cy="80" r="5" fill="#ffd700">
                    <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
                </circle>
                <circle cx="200" cy="80" r="4" fill="#2575fc">
                    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
                </circle>
                
                <!-- 渐变定义 -->
                <defs>
                    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6a11cb"/>
                        <stop offset="100%" stop-color="#2575fc"/>
                    </linearGradient>
                    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8a4fff"/>
                        <stop offset="100%" stop-color="#436fcf"/>
                    </linearGradient>
                </defs>
            </svg>